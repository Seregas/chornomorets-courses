schema: spec-driven

context: |
  Застосунок для студентів онлайн-курсів Петра Чорноморця (психолог).
  Монорепо: бекенд Hono + Drizzle/SQLite (`server/`), iOS на SwiftUI (`ios/`).
  Працює наживо на реальних курсах, збірки їздять у TestFlight.

  Мова: код, коментарі, комміти, специфікації й спілкування — українською.
  Коментарі пояснюють ЧОМУ, а не що.

  Архітектурні шви, які не можна ламати:
  - Дані — тільки через CourseRepository; schema.ts єдиний знає про таблиці.
  - Відео — тільки через video.ts: типізований дескриптор, не URL.
  - Усе особисте висить на Google-акаунті (accounts.id = sub), не на пристрої.
    deviceId лишився рівно в client_logs.
  - Щоденник практик не покидає телефон.
  - Квитанції зберігає Телеграм, свого сховища файлів немає.

  Модель даних: Course -> Stream (потік) -> Session (заняття).
  Підписка — на потік. Payment — на пару «заняття + акаунт».
  Архів — стан підписки (enrollments.archivedAt), а не її відсутність.
  Стан курсу визначає викладач (streams.status), а не наявність занять попереду.

  Деталі робочого процесу, деплою й відомих граблів — у CLAUDE.md в корені.

rules:
  specs:
    - "Писати українською, у поведінковій формі: що бачить студент або викладач."
    - Вимоги описують продуктовий контракт, а не внутрішню механіку.
    - "Розрізняти роль: студент, викладач (адмін за ADMIN_EMAILS), гість без входу."
    - Для особистих даних завжди вказувати поведінку без входу (401 -> запрошення увійти).
  tasks:
    - Перевірка = npm run typecheck + збірка iOS + запуск у симуляторі.
    - "Нова поведінка з розрахунками, статусами чи датами — з тестом. Правка UI — без: UI-тести SwiftUI найдорожчі в підтримці й гниють найшвидше."
    - Зміна схеми БД — окремим завданням із бекапом; db:push інтерактивний.
    - Після зміни клієнта підняти CURRENT_PROJECT_VERSION і вивантажити в TestFlight.
  design:
    - "Константа стає налаштуванням лише якщо це політика продукту або доступ, що протухає. Технічне підлаштування (таймаути, ліміти, кеш) лишається в коді з коментарем, що пояснює число."
    - Те, що стосується однієї людини (нагадування, адреса API), лишається на її пристрої, а не їде на сервер.
    - Зміни в даних живої бази — ідемпотентними скриптами в server/src/scripts/.
    - Нову таблицю з accountId дописати в claimPlaceholder (заочні акаунти).
