  <!-- catalog selected -->
  <g transform="translate(195,792)"><path d="M-8 -3 h12 a4 4 0 0 1 4 4 v13 h-12 a4 4 0 0 0 -4 4 z" fill="none" stroke="#0E7C86" stroke-width="2"/><text x="0" y="32" font-size="10" font-weight="600" fill="#0E7C86" text-anchor="middle">Курси</text></g>
  <!-- settings -->
  <g transform="translate(325,792)"><circle cx="0" cy="6" r="8" fill="none" stroke="#8E8E93" stroke-width="2"/><circle cx="0" cy="6" r="3" fill="none" stroke="#8E8E93" stroke-width="2"/><text x="0" y="32" font-size="10" fill="#8E8E93" text-anchor="middle">Налаштування</text></g>
  <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#1C1C1E"/>
