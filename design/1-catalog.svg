  <g fill="#1C1C1E"><rect x="320" y="22" width="18" height="11" rx="2"/><rect x="344" y="20" width="22" height="13" rx="3" fill="none" stroke="#1C1C1E"/><rect x="346" y="22" width="16" height="9" rx="1.5"/></g>
  <!-- title -->
