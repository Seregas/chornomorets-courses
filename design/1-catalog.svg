    <rect x="140" y="636" width="56" height="22" rx="11" fill="#E2F1F2"/><text x="151" y="651" font-size="12" font-weight="600" fill="#0E7C86">online</text>
    <rect x="202" y="636" width="150" height="22" rx="11" fill="#FFF1E6"/><circle cx="216" cy="647" r="3" fill="#E8833A"/><text x="224" y="651" font-size="12" font-weight="600" fill="#C96A24">Новий потік · з 5 сер</text>
