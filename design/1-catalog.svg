    <rect x="140" y="246" width="56" height="22" rx="11" fill="#E2F1F2"/><text x="151" y="261" font-size="12" font-weight="600" fill="#0E7C86">online</text>
    <rect x="202" y="246" width="150" height="22" rx="11" fill="#FFF1E6"/><circle cx="216" cy="257" r="3" fill="#E8833A"/><text x="224" y="261" font-size="12" font-weight="600" fill="#C96A24">Новий потік · з 8 лип</text>
  </g>
  <!-- card 2 -->
  <g>
    <rect x="20" y="288" width="350" height="118" rx="18" fill="#FFFFFF"/>
    <rect x="34" y="302" width="90" height="90" rx="14" fill="url(#sea2)"/>
    <path d="M34 370 q22 -14 45 0 t45 0 v22 h-90 z" fill="#1F6FB2" opacity="0.5"/>
