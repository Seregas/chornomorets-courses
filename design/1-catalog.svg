  <circle cx="42" cy="119" r="6" fill="none" stroke="#8E8E93" stroke-width="2"/><line x1="46" y1="123" x2="51" y2="128" stroke="#8E8E93" stroke-width="2"/>
  <text x="60" y="124" font-size="15" fill="#8E8E93">Пошук курсів</text>

