name: CoursesApp
options:
  bundleIdPrefix: com.chornomorets
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "17"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Автоматичний підпис. Team можна задати через env: DEVELOPMENT_TEAM=XXXX xcodegen generate
    # (або обрати команду в Xcode → Signing & Capabilities). Для симулятора підпис не потрібен.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"

targets:
  CoursesApp:
    type: application
    platform: iOS
    sources:
      - path: CoursesApp
      # Спільний зріз розкладу для віджета — компілюється в обидва таргети.
      - path: Shared
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: CoursesWidgets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.chornomorets.courses
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Лише iPhone. Задавати треба саме тут: значення з project-рівня
        # XcodeGen перекриває власним "1,2", і тоді Apple вимагає всі чотири
        # орієнтації для iPad-мультитаскінгу (помилка 90474 при вивантаженні).
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CoursesApp/CoursesApp.entitlements
      configs:
        # Локальний сервер під час розробки; для збірки на TestFlight адресу
        # передаємо в оточенні: API_BASE_URL=https://… xcodebuild archive …
        Debug:
          API_BASE_URL: http://localhost:3000
        Release:
          API_BASE_URL: ${API_BASE_URL}
    info:
      path: CoursesApp/Info.plist
      properties:
        CFBundleDisplayName: Курси
        # Без цього Xcode підставляє власні 1.0 (1), і друга збірка з тим самим
        # номером у TestFlight відхиляється. CURRENT_PROJECT_VERSION треба
        # інкрементувати на кожне вивантаження.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Записи слухають як подкаст — звук має грати з заблокованим екраном.
        UIBackgroundModes:
          - audio
        # Google Sign-In iOS client ID.
        GIDClientID: 1088990832674-rcgirjmgsejkatnog9bikcdk0ot3e4q1.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              # reversed client ID (та сама пара, у зворотному порядку)
              - com.googleusercontent.apps.1088990832674-rcgirjmgsejkatnog9bikcdk0ot3e4q1
        # Адреса API вшивається зі змінної збірки (див. configs вище).
        APIBaseURL: $(API_BASE_URL)
        # Дозволяємо http лише до локальної мережі (localhost, .local, приватні IP) —
        # цього досить для розробки проти Mac, і це проходить рев'ю, на відміну від
        # NSAllowsArbitraryLoads, яке відкривало http кудись завгодно.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # Віджет «найближче заняття». Дані бере з App Group, у мережу не ходить.
  CoursesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CoursesWidgets
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.chornomorets.courses.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CoursesWidgets/CoursesWidgets.entitlements
        SKIP_INSTALL: "YES"
    info:
      path: CoursesWidgets/Info.plist
      properties:
        CFBundleDisplayName: Курси
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
