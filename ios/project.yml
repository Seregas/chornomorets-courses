name: CoursesApp
options:
  bundleIdPrefix: com.chornomorets
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Автоматичний підпис. Team можна задати через env: DEVELOPMENT_TEAM=XXXX xcodegen generate
    # (або обрати команду в Xcode → Signing & Capabilities). Для симулятора підпис не потрібен.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"

targets:
  CoursesApp:
    type: application
    platform: iOS
    sources:
      - path: CoursesApp
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.chornomorets.courses
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CoursesApp/Info.plist
      properties:
        CFBundleDisplayName: Курси
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Google Sign-In iOS client ID.
        GIDClientID: 1088990832674-rcgirjmgsejkatnog9bikcdk0ot3e4q1.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              # reversed client ID (та сама пара, у зворотному порядку)
              - com.googleusercontent.apps.1088990832674-rcgirjmgsejkatnog9bikcdk0ot3e4q1
        # Dev: дозволяємо http до локального сервера (localhost і LAN-IP вашого Mac).
        # Для релізу прибрати й ходити лише по https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
